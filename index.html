
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weihnachtsgeheimnis 2026</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:linear-gradient(145deg,#071d18,#123c2d,#071d18);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.container{
  width:100%;
  max-width:650px;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(255,255,255,.2);
  border-radius:22px;
  padding:25px;
  box-shadow:0 12px 40px #0008;
}
h1{text-align:center;color:#ffe7a0;margin-top:5px}
h2{text-align:center;color:#ffe7a0}
.subtitle{text-align:center;color:#d7e8dc}
.hidden{display:none!important}
button{
  cursor:pointer;
  border:0;
  border-radius:12px;
  padding:13px 18px;
  font-size:16px;
  font-weight:bold;
}
.main-btn{
  display:block;
  width:100%;
  margin-top:20px;
  color:#10271d;
  background:#f5d77b;
}
.answer{
  display:block;
  width:100%;
  margin:10px 0;
  color:white;
  background:#245b45;
  border:1px solid #75a68a;
  text-align:left;
}
.answer:hover{background:#347657}
.answer:disabled{opacity:.55;cursor:default}
.info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:18px 0;
  flex-wrap:wrap;
}
.info span{
  background:#ffffff18;
  padding:9px 12px;
  border-radius:9px;
}
.progress-bg{
  height:12px;
  background:#ffffff25;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0 20px;
}
.progress{
  height:100%;
  width:0%;
  background:#f5d77b;
  transition:width .3s;
}
#question{
  font-size:21px;
  line-height:1.4;
  margin:25px 0;
}
#message{
  min-height:28px;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
}
.doors{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:22px;
}
.door{
  background:#8c2929;
  border:2px solid #e8c879;
  border-radius:12px;
  min-height:75px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
}
.door.unlocked{background:#26734b}
.door strong{font-size:24px}
.small{font-size:13px;color:#d6e5da;text-align:center}
.notice{
  text-align:center;
  color:#ffe7a0;
  line-height:1.5;
  margin-top:15px;
}
</style>
</head>
<body>
<div class="container">

  <section id="start">
    <h1>🎄 Weihnachtsgeheimnis 2026 🎄</h1>
    <p class="subtitle">Willkommen zu deiner persönlichen Weihnachtsmission!</p>
    <p class="notice">Beantworte 12 Fragen und sammle deine 8 Türchen.</p>
    <button class="main-btn" onclick="startMission()">Mission starten</button>
  </section>

  <section id="quiz" class="hidden">
    <h1 id="personTitle">Weihnachtsmission</h1>
    <div class="info">
      <span id="questionCounter">Frage 1 von 12</span>
      <span id="errorCounter">Fehler: 0 / 10</span>
    </div>
    <div class="progress-bg"><div class="progress" id="progress"></div></div>
    <div id="question"></div>
    <div id="answers"></div>
    <div id="message"></div>
    <button id="nextBtn" class="main-btn hidden" onclick="nextQuestion()">Weiter</button>
  </section>

  <section id="final" class="hidden">
    <h1>🎄 Geschafft! 🎄</h1>
    <h2 id="finalTitle">Deine Weihnachtsmission</h2>
    <p class="subtitle">Du hast alle 12 Fragen beantwortet!</p>
    <p class="notice">Hier sind deine gesammelten Türchen:</p>
    <div class="doors" id="finalDoors"></div>
    <p id="finalErrors" class="notice"></p>
  </section>

</div>

<script>
const MAX_QUESTIONS = 12;
const MAX_ERRORS = 10;

// Die Türchennummern bleiben unverändert.
const missions = {
  mama: {
    name: "Mami",
    doors: [2,6,8,11,14,17,19,23],
    questions: [
      {q:"Was ist 8 × 7?",a:["54","56","64","48"],c:1},
      {q:"Wie heißt die englische Übersetzung von „Apfel“?",a:["Pear","Banana","Apple","Orange"],c:2},
      {q:"Was ist 125 + 75?",a:["175","190","200","210"],c:2},
      {q:"Wie heißt „Guten Morgen“ auf Französisch?",a:["Bonsoir","Bonjour","Merci","Au revoir"],c:1},
      {q:"Wie viele Bundesländer hat Deutschland?",a:["14","15","16","17"],c:2},
      {q:"Was ist die Hauptstadt von Frankreich?",a:["Lyon","Marseille","Paris","Nizza"],c:2},
      {q:"Was ist 9 × 9?",a:["72","81","91","99"],c:1},
      {q:"Welche Form ist die Vergangenheit von „go“?",a:["goed","gone","went","goes"],c:2},
      {q:"Wie heißt „Danke“ auf Französisch?",a:["Pardon","Merci","Salut","Oui"],c:1},
      {q:"Wie viele Minuten hat eine Stunde?",a:["50","60","70","100"],c:1},
      {q:"Welcher Fluss fließt durch Paris?",a:["Rhein","Donau","Seine","Elbe"],c:2},
      {q:"Was ist 144 : 12?",a:["10","11","12","14"],c:2}
    ]
  },

  papa: {
    name: "Dusi",
    doors: [1,4,7,10,13,16,20,22],
    questions: [
      {q:"Welcher Hersteller baute die Simson S51?",a:["MZ","Simson","Kreidler","Zündapp"],c:1},
      {q:"Wie viele Gänge hat eine originale Simson S51?",a:["3","4","5","6"],c:1},
      {q:"In welcher Stadt wurden Simson-Fahrzeuge gebaut?",a:["Dresden","Zwickau","Suhl","Chemnitz"],c:2},
      {q:"Welchen Hubraum hat die S51 ungefähr?",a:["50 cm³","80 cm³","125 cm³","250 cm³"],c:0},
      {q:"Welche Motorbauart hat die klassische S51?",a:["Viertakt","Zweitakt","Diesel","Elektro"],c:1},
      {q:"Wie wird das Kraftstoff-Öl-Gemisch beim Zweitakter benötigt?",a:["Zum Schmieren","Zum Kühlen der Reifen","Für die Beleuchtung","Für die Bremse"],c:0},
      {q:"Welche Höchstgeschwindigkeit ist für viele originale S51 mit entsprechender DDR-Zulassung bekannt?",a:["45 km/h","50 km/h","60 km/h","80 km/h"],c:2},
      {q:"Wie wird die Zündung bei der klassischen S51 unter anderem erzeugt?",a:["Durch eine Zündanlage","Durch die Bremse","Durch die Kette","Durch den Auspuff"],c:0},
      {q:"Welche Aufgabe hat die Kupplung?",a:["Sie schaltet das Licht","Sie trennt den Kraftfluss zum Getriebe","Sie pumpt Benzin","Sie bremst das Vorderrad"],c:1},
      {q:"Was sorgt dafür, dass die Kette nicht abspringt?",a:["Die Kettenspannung","Der Tankdeckel","Der Vergaser","Die Hupe"],c:0},
      {q:"Wofür ist der Vergaser zuständig?",a:["Für das Gemisch aus Kraftstoff und Luft","Für die Bremsflüssigkeit","Für den Reifendruck","Für das Rücklicht"],c:0},
      {q:"Was sollte man vor einer längeren Fahrt kontrollieren?",a:["Nur die Farbe","Bremsen, Reifen und Beleuchtung","Nur den Sitz","Nur den Tankdeckel"],c:1}
    ]
  },

  luni: {
    name: "Luni",
    doors: [3,5,9,12,15,18,21,24],
    questions: [
      {q:"Was bedeutet ein rotes Licht an einer Ampel?",a:["Fahren","Anhalten","Schneller fahren","Hupen"],c:1},
      {q:"Wer hat an einem Zebrastreifen Vorrang?",a:["Fußgänger","Autos immer","Fahrräder immer","Niemand"],c:0},
      {q:"Was bedeutet ein Stoppschild?",a:["Langsam weiterfahren","Vorfahrt beachten","Anhalten und Vorfahrt gewähren","Nur hupen"],c:2},
      {q:"Was solltest du beim Klettern vor dem Losklettern prüfen?",a:["Nur die Schuhe","Ausrüstung und Sicherung","Nur die Wandfarbe","Nichts"],c:1},
      {q:"Was ist beim Klettern besonders wichtig?",a:["Sicherheit und Aufmerksamkeit","Möglichst schnell sein","Andere ablenken","Ohne Absprache starten"],c:0},
      {q:"Was bedeutet ein dreieckiges Verkehrsschild mit rotem Rand meistens?",a:["Gefahr oder Warnung","Parkplatz","Autobahn","Einbahnstraße"],c:0},
      {q:"Was sollte man beim Klettern mit dem Sicherungspartner machen?",a:["Absprachen treffen","Einfach loslegen","Nicht miteinander sprechen","Die Ausrüstung ignorieren"],c:0},
      {q:"Was bedeutet eine durchgezogene Linie auf der Fahrbahn?",a:["Sie darf grundsätzlich nicht überfahren werden","Man muss schneller fahren","Parken ist erlaubt","Sie ist nur Dekoration"],c:0},
      {q:"Warum kontrolliert man vor dem Klettern den Knoten?",a:["Damit die Sicherung richtig funktioniert","Damit man schneller ist","Damit die Seillänge größer wird","Nur wegen der Optik"],c:0},
      {q:"Was bedeutet rechts vor links?",a:["Der Verkehr von rechts hat Vorrang","Der Verkehr von links hat Vorrang","Autos haben immer Vorrang","Fußgänger müssen warten"],c:0},
      {q:"Was machst du, wenn du beim Klettern unsicher bist?",a:["Einfach weitermachen","Anhalten und mit dem Partner sprechen","Die Sicherung lösen","Schnell springen"],c:1},
      {q:"Was gehört zu einer sicheren Kletterausrüstung?",a:["Gurt, Seil und passende Sicherungsausrüstung","Nur normale Turnschuhe","Ein Rucksack","Eine Sonnenbrille"],c:0}
    ]
  }
};

let person = null;
let current = 0;
let errors = 0;
let unlocked = [];
let answered = false;

function getMission() {
  const params = new URLSearchParams(window.location.search);
  let id = (params.get("mission") || "mama").toLowerCase();

  if(id === "mami") id = "mama";
  if(id === "dusi") id = "papa";
  if(id === "luna") id = "luni";

  return missions[id] ? id : "mama";
}

function storageKey() {
  return "weihnachtsgeheimnis2026_v12_e10_" + person;
}

function saveProgress() {
  localStorage.setItem(storageKey(), JSON.stringify({
    current,
    errors,
    unlocked
  }));
}

function loadProgress() {
  const saved = localStorage.getItem(storageKey());
  if(!saved) return;

  try {
    const data = JSON.parse(saved);
    current = Math.min(Math.max(data.current || 0,0),11);
    errors = Math.min(Math.max(data.errors || 0,0),9);
    unlocked = Array.isArray(data.unlocked)
      ? data.unlocked.filter(n => missions[person].doors.includes(n))
      : [];
  } catch(e) {
    localStorage.removeItem(storageKey());
  }
}

function startMission() {
  person = getMission();
  loadProgress();

  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("personTitle").textContent =
    "🎄 Mission für " + missions[person].name;

  showQuestion();
}

function showQuestion() {
  answered = false;
  const mission = missions[person];
  const item = mission.questions[current];

  document.getElementById("questionCounter").textContent =
    "Frage " + (current+1) + " von 12";

  document.getElementById("errorCounter").textContent =
    "Fehler: " + errors + " / 10";

  document.getElementById("progress").style.width =
    ((current / MAX_QUESTIONS) * 100) + "%";

  document.getElementById("question").textContent = item.q;
  document.getElementById("message").textContent = "";
  document.getElementById("nextBtn").classList.add("hidden");

  const answers = document.getElementById("answers");
  answers.innerHTML = "";

  item.a.forEach((answer,index) => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = String.fromCharCode(65+index) + ") " + answer;
    btn.onclick = () => checkAnswer(index,btn);
    answers.appendChild(btn);
  });
}

function checkAnswer(index,button) {
  if(answered) return;

  const item = missions[person].questions[current];

  if(index === item.c) {
    answered = true;
    button.style.background = "#26734b";

    // Acht Türchen werden auf zwölf Fragen verteilt.
    const rewardQuestions = [0,1,3,4,6,7,9,11];

    if(rewardQuestions.includes(current)) {
      const rewardIndex = rewardQuestions.indexOf(current);
      const door = missions[person].doors[rewardIndex];

      if(!unlocked.includes(door)) unlocked.push(door);

      document.getElementById("message").textContent =
        "🎁 Richtig! Türchen " + door + " freigeschaltet!";
    } else {
      document.getElementById("message").textContent =
        "✓ Richtig beantwortet!";
    }

    document.querySelectorAll(".answer").forEach(b => b.disabled = true);
    document.getElementById("nextBtn").classList.remove("hidden");
    saveProgress();
  } else {
    errors++;
    document.getElementById("errorCounter").textContent =
      "Fehler: " + errors + " / 10";

    button.disabled = true;
    button.style.background = "#8c2929";

    if(errors >= MAX_ERRORS) {
      resetMission();
      return;
    }

    document.getElementById("message").textContent =
      "Leider falsch! Versuche eine andere Antwort.";
    saveProgress();
  }
}

function nextQuestion() {
  current++;

  if(current >= MAX_QUESTIONS) {
    showFinal();
    return;
  }

  saveProgress();
  showQuestion();
}

function resetMission() {
  current = 0;
  errors = 0;
  unlocked = [];

  localStorage.removeItem(storageKey());

  document.getElementById("message").textContent =
    "10 Fehler erreicht! Die Mission wird zurückgesetzt.";

  setTimeout(() => {
    saveProgress();
    showQuestion();
  },1800);
}

function showFinal() {
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("final").classList.remove("hidden");

  document.getElementById("finalTitle").textContent =
    "Mission für " + missions[person].name;

  document.getElementById("progress").style.width = "100%";

  const doors = document.getElementById("finalDoors");
  doors.innerHTML = "";

  missions[person].doors.forEach(number => {
    const div = document.createElement("div");
    div.className = "door" + (unlocked.includes(number) ? " unlocked" : "");

    div.innerHTML = unlocked.includes(number)
      ? "<strong>🎁</strong><span>Türchen " + number + "</span><span>Freigeschaltet</span>"
      : "<strong>🔒</strong><span>Türchen " + number + "</span><span>Noch gesperrt</span>";

    doors.appendChild(div);
  });

  document.getElementById("finalErrors").textContent =
    "Du hattest insgesamt " + errors + " Fehler.";

  localStorage.removeItem(storageKey());
}

</script>
</body>
</html>
